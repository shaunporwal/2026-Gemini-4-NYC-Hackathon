<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fire Twin camera</title>
<style>
  /* Phone first, dark only. Every color and size is a token. */
  :root {
    color-scheme: dark;
    --bg: #0c0f14; --panel: #11151c; --control: #1b212c; --line: #323b4a; --text: #e6e9ee; --muted: #9aa4b2;
    --accent: #2b6cb0; --focus: #7cc4ff; --ok: #4ade80; --bad: #ff6b61; --video: #000; --scrim: rgba(0, 0, 0, .62);
    --gutter: 12px; --gap: 8px; --tap: 48px; --radius: 10px; --fs: 16px; --fs-small: 13px; --fs-title: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100dvh; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; gap: var(--gap); padding: var(--gutter); padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
         background-color: var(--bg); color: var(--text); font: var(--fs)/1.35 system-ui, -apple-system, sans-serif; overflow-wrap: anywhere; }
  header { display: flex; align-items: center; gap: var(--gap); min-height: var(--tap); }
  #change { max-width: 60%; text-align: left; }
  h1 { flex: 1; margin: 0; font-size: var(--fs-title); }
  /* Page switch: this camera page and the twin (the simulation). 2 joined links; the current page is marked. */
  nav { display: flex; flex: none; }
  nav a { min-height: var(--tap); min-width: 84px; padding: 0 16px; display: flex; align-items: center; justify-content: center;
          border: 1px solid var(--line); background-color: var(--control); color: inherit; text-decoration: none; }
  nav a:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  nav a:last-child { border-radius: 0 var(--radius) var(--radius) 0; margin-left: -1px; }
  nav a.on { background-color: var(--panel); border-color: var(--focus); position: relative; font-weight: 600; }
  #sub { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); min-height: 24px; }
  #where { color: var(--muted); font-size: var(--fs-small); }
  button, .file { min-height: var(--tap); padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--line);
                  background-color: var(--control); color: inherit; font: inherit; display: flex; align-items: center; justify-content: center; }
  button.primary { background-color: var(--accent); border-color: var(--accent); font-weight: 600; }
  button:active, .file:active { transform: translateY(1px); }
  [hidden] { display: none !important; }

  /* Step 1: pick the room. One bordered list, full-width rows. The list is the one scrolling region. */
  #pick { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
  #rooms { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); background-color: var(--panel); }
  #rooms button { width: 100%; justify-content: flex-start; border: 0; border-radius: 0; background-color: transparent; text-align: left; }
  #rooms button + button { border-top: 1px solid var(--line); }
  #rooms button.on { background-color: var(--control); font-weight: 600; }
  #rooms button { gap: var(--gutter); }
  /* The key number of a room: the same number is on its block on the floor plan. */
  .key { flex: none; min-width: 30px; height: 30px; padding: 0 6px; display: flex; align-items: center; justify-content: center;
         border-radius: 8px; border: 1px solid var(--line); background-color: var(--control); font-weight: 700; font-variant-numeric: tabular-nums; }
  #rooms button.on .key { background-color: var(--accent); border-color: var(--accent); }
  /* The floor plan. Tap a room; the list row and the button below show its name. */
  #plan { flex: none; width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background-color: var(--panel); touch-action: manipulation; }
  #plan rect { fill: var(--control); stroke: var(--line); stroke-width: 0.35; }
  #plan rect.on { fill: var(--accent); }
  #plan text { fill: var(--text); font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  #plan text.name { fill: var(--muted); font-weight: 500; }
  #legend { color: var(--muted); font-size: var(--fs-small); }

  /* Step 2: the camera. */
  #cam { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
  #view { flex: 1; min-height: 0; position: relative; border-radius: var(--radius); overflow: hidden; background-color: var(--video); }
  video, #poster { width: 100%; height: 100%; object-fit: cover; display: block; }
  #poster { position: absolute; inset: 0; }
  /* What to do now. Over the last frame after a recording; over black before the first one. */
  #note { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gutter);
          padding: var(--gutter); text-align: center; color: var(--text); background-color: var(--scrim); }
  #note p { margin: 0; max-width: 30ch; }
  #note a { min-height: var(--tap); padding: 0 20px; display: flex; align-items: center; border-radius: var(--radius); border: 1px solid var(--focus);
            background-color: var(--control); color: inherit; text-decoration: none; font-weight: 600; }
  /* Facts: one key-value row, not tiles. */
  #facts { display: flex; justify-content: space-between; gap: var(--gap); padding: 0 2px; }
  #facts div { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  #facts b { font-size: var(--fs-title); font-variant-numeric: tabular-nums; }
  #facts span { color: var(--muted); font-size: var(--fs-small); }
  /* Microphone level: moves when the phone hears anything, so you can see the microphone works. */
  #meter { display: inline-block; width: 28px; height: 8px; border-radius: 4px; background-color: var(--control); overflow: hidden; align-self: center; }
  #level { display: block; width: 0; height: 100%; background-color: var(--ok); }
  #status { min-height: 20px; color: var(--muted); font-size: var(--fs-small); text-align: center; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .row { display: flex; gap: var(--gap); }
  .row > * { flex: 1 1 0; min-width: 0; }
  .file input { display: none; }
  .switch { display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); padding: 0 var(--gutter);
            border: 1px solid var(--line); border-radius: var(--radius); }
  .switch input { width: 22px; height: 22px; accent-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Fire Twin</h1>
  <nav aria-label="Page">
    <a class="on" aria-current="page">Camera</a><a href="/app/">Twin</a>
  </nav>
</header>
<div id="sub">
  <span id="where">Pick the room you are in</span>
  <button id="change" hidden></button>
</div>

<section id="pick">
  <svg id="plan" hidden></svg>
  <div id="legend" hidden>Each number on the floor plan is a room in the list.</div>
  <div id="rooms"></div>
  <button id="use" class="primary" disabled>Tap your room on the map or in the list</button>
</section>

<section id="cam" hidden>
  <div id="view">
    <video id="v" autoplay playsinline muted></video>
    <img id="poster" alt="Last frame sent" hidden>
    <div id="note"><p id="noteText"></p><a id="noteTwin" href="/app/" hidden>See it on the Twin</a></div>
  </div>
  <div id="facts">
    <div><span>People</span><b id="fPeople">–</b></div>
    <div><span>Fire</span><b id="fHazard">–</b></div>
    <div><span>Sound</span><i id="meter" title="Microphone level"><i id="level"></i></i><b id="fSound">–</b></div>
  </div>
  <div id="status"></div>
  <label class="switch"><span>Send microphone sound</span><input type="checkbox" id="mic" checked></label>
  <div class="row">
    <button id="b" class="primary">Start camera</button>
    <label class="file">One photo<input type="file" id="photo" accept="image/*" capture="environment"></label>
  </div>
</section>

<canvas id="c" hidden></canvas>
<script>
const q = new URLSearchParams(location.search);
const intervalMs = +(q.get('ms') || 1000);   // send a frame every N ms
const width = +(q.get('w') || 640);          // downscale before upload
const clipS = +(q.get('clip') || 2);         // audio clip length in seconds
const $ = id => document.getElementById(id);
const v = $('v'), c = $('c'), ctx = c.getContext('2d');
const TEXT = {
  start: 'Start camera', stop: 'Stop', again: 'Record again',
  idle: 'Tap Start camera to send live video of this room, or One photo for a single picture.',
  starting: 'Starting the camera…',
  blocked: 'The camera is blocked. Allow camera access for this site, then tap Start camera. A live camera needs the https link; "One photo" works on any link.',
  sent: 'Photo sent. Gemini is reading it…', failed: 'Upload failed: ', warming: 'Gemini is reading the first frame…',
  lost: 'This room is not on the twin now. Tap the room name and pick again.',
  slow: 'No answer yet. Look at the big screen.', listening: 'listening…', noMic: 'mic off', onTwin: ' The twin now shows this.'
};
let cam = q.get('id'), running = false, sent = 0, wakeLock = null, audio = null;
/* Session number. Each start and each stop makes a new session. A permission answer, a frame or a sound
 * clip from an old session is dropped. Checked as a state machine: specs/PhoneCamera.tla (Fixed = TRUE). */
let session = 0;

const show = (el, on) => { el.toggleAttribute('hidden', !on); };   // works for SVG too
/* The message over the camera view: what is happening, or what to do next. twin = also offer the Twin page. */
function note(text, twin) { $('noteText').textContent = text; show($('noteTwin'), !!twin); show($('note'), true); }
function status(text, cls) { $('status').textContent = text; $('status').className = cls || ''; }

/* Step 1 -> step 2. Called from a tap, so the browser lets the camera start at once. */
function enter(room, startNow) {
  cam = room;
  localStorage.setItem(ROOM_STORE, room);   // coming back from the Twin page returns to this room
  history.replaceState(null, '', '/camera?id=' + encodeURIComponent(room));
  $('where').textContent = 'Your room (tap to change):';
  $('change').textContent = room;
  show($('pick'), false); show($('cam'), true); show($('change'), true);
  show($('poster'), false);
  $('b').textContent = TEXT.start;
  note(TEXT.idle);
  if (startNow) start();
}

function leave() {
  stop();
  cam = null;
  localStorage.removeItem(ROOM_STORE);
  history.replaceState(null, '', '/camera');
  $('where').textContent = 'Pick the room you are in';
  show($('cam'), false); show($('change'), false); show($('pick'), true);
}

/* Room picker: the floor plan and the list show the same rooms. A tap on one selects it in both;
 * the button below then starts the camera for that room. */
const RESULT_MS = 1500, RESULT_TRIES = 16;
const ROOM_STORE = 'fireTwinRoom';
const LEVEL_GAIN = 600;   // microphone level (0..1 RMS) -> percent of the meter
const SOUND = { none: 'no alarm', alarm: 'ALARM', screaming: 'SCREAMING' };   // what Gemini heard in the last 2 s
const SVG = 'http://www.w3.org/2000/svg', LABEL = { size: 3, name: 1.5, perChar: 0.62 };
const picked = { name: null, marks: new Map() };   // room name -> [list row, plan rect]

function select(name) {
  picked.marks.forEach((els, n) => els.forEach(e => e.classList.toggle('on', n === name)));
  picked.name = name;
  $('use').disabled = false;
  $('use').textContent = 'Use ' + name;
  picked.marks.get(name)[0].scrollIntoView({ block: 'nearest' });
}
$('use').onclick = () => enter(picked.name, true);

/* Every room gets a key number, on its block and on its list row. A big block also shows the room name. */
function drawPlan(plan) {
  const svg = $('plan'), node = (tag, attrs) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  svg.setAttribute('viewBox', `-1 -1 ${plan.width + 2} ${plan.height + 2}`);
  plan.rooms.forEach(r => {
    const rect = node('rect', { x: r.x + 0.5, y: r.y + 0.5, width: r.w - 1, height: r.h - 1, rx: 0.6 });
    rect.onclick = () => select(r.name);
    svg.append(rect);
    picked.marks.get(r.name).push(rect);
  });
  plan.rooms.forEach((r, k) => {   // labels on top of all rooms
    const key = String(k + 1), size = Math.min(LABEL.size, (r.w - 1.6) / (key.length * LABEL.perChar), r.h - 1.6);
    const named = r.name.length * LABEL.perChar * LABEL.name <= r.w - 2 && r.h >= LABEL.size + LABEL.name + 2;
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const t = node('text', { x: cx, y: named ? cy - LABEL.name * 0.7 : cy, 'font-size': size });
    t.textContent = key;
    svg.append(t);
    if (!named) return;
    const n = node('text', { x: cx, y: cy + LABEL.size * 0.6, 'font-size': LABEL.name, class: 'name' });
    n.textContent = r.name;
    svg.append(n);
  });
  show(svg, true); show($('legend'), true);
}

fetch('/').then(r => r.json()).then(j => {
  const names = j.rooms.length ? j.rooms : Object.keys(j.cameras);   // rooms of the twin, else cameras of the map
  names.forEach((name, k) => {
    const b = document.createElement('button'), key = document.createElement('span'), text = document.createElement('span');
    key.className = 'key'; key.textContent = k + 1; text.textContent = name;
    b.append(key, text);
    b.onclick = () => select(name);
    $('rooms').append(b);
    picked.marks.set(name, [b]);
  });
  if (j.plan && j.plan.rooms && j.plan.rooms.length) drawPlan(j.plan);
  const back = localStorage.getItem(ROOM_STORE);   // the room chosen before a visit to the Twin page
  if (!cam && back && names.includes(back)) enter(back, false);
});
if (cam) enter(cam, false);
$('change').onclick = leave;

async function keepAwake() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(); });

async function start() {
  const my = ++session, room = cam, withMic = $('mic').checked;
  // iOS: the audio context must be made and resumed inside the tap, before any wait. Made later, it stays suspended and no sound is sent.
  const ac = withMic ? new (window.AudioContext || window.webkitAudioContext)() : null;
  if (ac) ac.resume().catch(() => {});
  sent = 0;
  show($('poster'), false);
  note(TEXT.starting);
  const drop = () => { if (ac) ac.close().catch(() => {}); };
  let stream;
  try {
    if (!navigator.mediaDevices) throw new Error('no camera API on this link');
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: withMic });
  } catch (e) {
    drop();
    if (my !== session) return;
    note(TEXT.blocked);
    status(e.message, 'bad');
    return;
  }
  if (my !== session || !room) { stream.getTracks().forEach(t => t.stop()); drop(); return; }   // answered too late: release the camera
  v.srcObject = new MediaStream(stream.getVideoTracks());
  try { await v.play(); } catch (e) {}
  show($('note'), false);
  keepAwake();
  running = true; $('b').textContent = TEXT.stop;
  status(TEXT.warming);
  if (ac && stream.getAudioTracks().length) { $('fSound').textContent = TEXT.listening; startAudio(ac, stream, my, room); }
  else { drop(); $('fSound').textContent = TEXT.noMic; }
  loop(my, room);
}

function stop() {
  session++;
  const wasRunning = running;
  running = false; stopAudio();
  $('level').style.width = '0';
  if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
  if (!wasRunning) return;
  // After a recording: keep the last frame on screen and say what was sent and what to do next.
  $('b').textContent = TEXT.again;
  if (sent && c.width) { $('poster').src = c.toDataURL('image/jpeg', 0.7); show($('poster'), true); }
  note(sent ? 'Sent ' + sent + ' frames of ' + cam + '. Gemini counted ' + $('fPeople').textContent + ' people. The room on the Twin now shows this.'
            : TEXT.idle, sent > 0);
  status('');
}

$('b').onclick = () => (running ? stop() : start());

// ---- audio: raw PCM -> 16 kHz mono WAV clips (the API takes audio/wav, not the browser's webm)
function startAudio(ac, stream, my, room) {
  if (ac.state !== 'running') ac.resume().catch(() => {});
  const src = ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
  const proc = ac.createScriptProcessor(4096, 1, 1);
  let buf = [], n = 0;
  proc.onaudioprocess = e => {
    const d = e.inputBuffer.getChannelData(0);
    buf.push(new Float32Array(d)); n += d.length;
    let sum = 0; for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
    $('level').style.width = Math.min(100, Math.round(Math.sqrt(sum / d.length) * LEVEL_GAIN)) + '%';
    if (n >= ac.sampleRate * clipS) { if (my === session) sendClip(buf, n, ac.sampleRate, room); buf = []; n = 0; }
  };
  src.connect(proc); proc.connect(ac.destination);
  audio = { ac, proc, src, tracks: stream.getAudioTracks() };
}
function stopAudio() {
  if (!audio) return;
  audio.proc.disconnect(); audio.src.disconnect(); audio.ac.close(); audio.tracks.forEach(t => t.stop()); audio = null;
}
function sendClip(chunks, n, rate, room) {
  const pcm = new Float32Array(n); let o = 0;
  for (const ch of chunks) { pcm.set(ch, o); o += ch.length; }
  const outRate = 16000, step = rate / outRate, m = Math.floor(n / step);
  const wav = new DataView(new ArrayBuffer(44 + m * 2));
  const str = (off, t) => { for (let i = 0; i < t.length; i++) wav.setUint8(off + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); wav.setUint32(4, 36 + m * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 1, true);
  wav.setUint32(24, outRate, true); wav.setUint32(28, outRate * 2, true);
  wav.setUint16(32, 2, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, m * 2, true);
  for (let i = 0; i < m; i++) {
    const x = Math.max(-1, Math.min(1, pcm[Math.floor(i * step)]));
    wav.setInt16(44 + i * 2, x * 0x7fff, true);
  }
  fetch('/audio/' + encodeURIComponent(room), { method: 'POST', body: wav.buffer, headers: { 'Content-Type': 'audio/wav' } })
    .then(r => r.json()).then(j => { $('fSound').textContent = j.error ? 'error' : SOUND[j.event] || j.event; })
    .catch(() => { $('fSound').textContent = 'failed'; });
}

function report(j, ms) {
  $('fPeople').textContent = j.peopleCount;
  $('fHazard').textContent = j.hazard;
  if (!j.known) status(TEXT.lost, 'bad');
  else if (j.ok) status('frames ' + sent + ' · upload ' + ms + ' ms · Gemini ' + (j.latencyMs == null ? '-' : j.latencyMs) + ' ms', 'ok');
  else status(j.error || TEXT.warming, j.error ? 'bad' : '');
}

async function postFrame(room, blob) {
  const r = await fetch('/frame/' + encodeURIComponent(room), { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
  return r.json();
}

async function loop(my, room) {
  while (running && my === session) {
    const t0 = performance.now();
    if (v.videoWidth) {
      const h = Math.round(v.videoHeight * width / v.videoWidth);
      c.width = width; c.height = h; ctx.drawImage(v, 0, 0, width, h);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.6));
      if (my !== session) return;   // stopped or changed room during the capture: send nothing
      try { const j = await postFrame(room, blob); if (my !== session) return; sent++; report(j, Math.round(performance.now() - t0)); }
      catch (e) { if (my === session) status(TEXT.failed + e.message, 'bad'); }
    }
    const wait = intervalMs - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
}

// One still photo from the phone's own camera app. No live stream, so plain http on the venue Wi-Fi is enough.
$('photo').onchange = async ev => {
  const file = ev.target.files[0], room = cam; ev.target.value = '';
  if (!file || !room) return;
  const img = await createImageBitmap(file), k = Math.min(1, 1024 / Math.max(img.width, img.height));
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); ctx.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  try {
    const sent = await postFrame(room, blob);
    if (room !== cam) return;
    if (!sent.known) return status(TEXT.lost, 'bad');
    status(TEXT.sent);
    const o = await resultOf(room, sent.timestamp);
    if (room !== cam) return;
    if (!o) return status(TEXT.slow);
    $('fPeople').textContent = o.peopleCount;
    $('fHazard').textContent = o.events.find(e => e === 'fire' || e === 'smoke') || 'none';
    if (o.stream.error) status(o.stream.error, 'bad');
    else status('Gemini: ' + o.peopleCount + ' people, ' + o.density + (o.events.length ? ', ' + o.events.join(', ') : '') + '.' + TEXT.onTwin, 'ok');
  } catch (e) { status(TEXT.failed + e.message, 'bad'); }
};

/* Wait for Gemini's answer for a frame sent at server time `since`. Null if it takes too long. */
async function resultOf(room, since) {
  for (let n = 0; n < RESULT_TRIES; n++) {
    await new Promise(r => setTimeout(r, RESULT_MS));
    const o = (await (await fetch('/observations')).json()).observations[room];
    if (o && o.timestamp >= since && o.stream.latencyMs != null && (o.stream.ok || o.stream.error)) return o;
  }
  return null;
}
</script>
</body>
</html>
