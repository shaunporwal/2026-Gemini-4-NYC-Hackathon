<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twin camera</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  video { width: 100%; max-height: 65vh; background: #000; display: block; }
  #s { padding: 12px; font-size: 17px; line-height: 1.4; }
  button { font-size: 20px; padding: 12px 22px; margin: 12px; border-radius: 10px; border: 0; }
  label { margin: 12px; font-size: 17px; }
  a { color: #8cf; display: block; padding: 8px 12px; font-size: 18px; }
  .ok { color: #7f7; } .bad { color: #f77; }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<button id="b">Start camera</button>
<label><input type="checkbox" id="mic" checked> Microphone</label>
<label id="shot" style="display:block">One photo (works without HTTPS): <input type="file" id="photo" accept="image/*" capture="environment"></label>
<div id="s">Usage: /camera?id=&lt;cameraId from the map&gt;&amp;ms=1000&amp;w=640</div>
<div id="list"></div>
<canvas id="c" style="display:none"></canvas>
<script>
const q = new URLSearchParams(location.search);
const cam = q.get('id');
const intervalMs = +(q.get('ms') || 1000);   // send a frame every N ms
const width = +(q.get('w') || 640);          // downscale before upload
const clipS = +(q.get('clip') || 2);         // audio clip length in seconds
const v = document.getElementById('v'), c = document.getElementById('c'), s = document.getElementById('s');
const ctx = c.getContext('2d');
let running = false, sent = 0, wakeLock = null, audio = null, lastAudio = '';

if (!cam) {  // no id: pick the room you are in (rooms of the twin on screen), or a camera of the map
  document.getElementById('b').style.display = document.getElementById('shot').style.display = 'none';
  fetch('/').then(r => r.json()).then(j => {
    const list = document.getElementById('list');
    const link = (href, text) => { const a = document.createElement('a'); a.href = href; a.textContent = text; list.append(a); };
    if (j.rooms.length) {
      s.textContent = 'Which room are you in?';
      j.rooms.forEach(name => link('/camera?id=' + encodeURIComponent(name), name));
    } else {
      s.textContent = `Map "${j.map}". Pick the camera this phone is:`;
      Object.entries(j.cameras).forEach(([id, x]) => link(x.page, `${x.name} (${id})`));
    }
  });
}

// One still photo from the phone's own camera app. No live stream, so plain http on the venue Wi-Fi is enough.
document.getElementById('photo').onchange = async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  const img = await createImageBitmap(file), k = Math.min(1, 1024 / Math.max(img.width, img.height));
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); ctx.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  try {
    await fetch('/frame/' + encodeURIComponent(cam), { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
    s.innerHTML = `<b>${cam}</b> · photo sent. <span class="ok">Watch the big screen.</span>`;
  } catch (e) { s.innerHTML = '<span class="bad">Upload failed: ' + e.message + '</span>'; }
};

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(); });

document.getElementById('b').onclick = async () => {
  if (running) { running = false; stopAudio(); document.getElementById('b').textContent = 'Start camera'; return; }
  const withMic = document.getElementById('mic').checked;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: withMic });
    v.srcObject = new MediaStream(stream.getVideoTracks()); await v.play();
  } catch (e) {
    s.innerHTML = '<span class="bad">Camera blocked: ' + e.message +
      '. Phones need HTTPS (use the tunnel URL), and allow camera permission.</span>';
    return;
  }
  keepAwake();
  running = true; document.getElementById('b').textContent = 'Stop';
  if (withMic && stream.getAudioTracks().length) startAudio(stream);
  loop();
};

// ---- audio: raw PCM -> 16 kHz mono WAV clips (the API takes audio/wav, not the browser's webm)
function startAudio(stream) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const src = ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
  const proc = ac.createScriptProcessor(4096, 1, 1);
  let buf = [], n = 0;
  proc.onaudioprocess = e => {
    const d = e.inputBuffer.getChannelData(0);
    buf.push(new Float32Array(d)); n += d.length;
    if (n >= ac.sampleRate * clipS) { sendClip(buf, n, ac.sampleRate); buf = []; n = 0; }
  };
  src.connect(proc); proc.connect(ac.destination);
  audio = { ac, proc, src };
}
function stopAudio() {
  if (!audio) return;
  audio.proc.disconnect(); audio.src.disconnect(); audio.ac.close(); audio = null;
}
function sendClip(chunks, n, rate) {
  const pcm = new Float32Array(n); let o = 0;
  for (const ch of chunks) { pcm.set(ch, o); o += ch.length; }
  const outRate = 16000, step = rate / outRate, m = Math.floor(n / step);
  const wav = new DataView(new ArrayBuffer(44 + m * 2));
  const str = (off, t) => { for (let i = 0; i < t.length; i++) wav.setUint8(off + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); wav.setUint32(4, 36 + m * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 1, true);
  wav.setUint32(24, outRate, true); wav.setUint32(28, outRate * 2, true);
  wav.setUint16(32, 2, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, m * 2, true);
  for (let i = 0; i < m; i++) {
    const x = Math.max(-1, Math.min(1, pcm[Math.floor(i * step)]));
    wav.setInt16(44 + i * 2, x * 0x7fff, true);
  }
  fetch('/audio/' + encodeURIComponent(cam), { method: 'POST', body: wav.buffer, headers: { 'Content-Type': 'audio/wav' } })
    .then(r => r.json()).then(j => { lastAudio = j.error ? 'audio error' : `audio ${j.event}`; })
    .catch(() => { lastAudio = 'audio upload failed'; });
}

async function loop() {
  while (running) {
    const t0 = performance.now();
    if (v.videoWidth) {
      const h = Math.round(v.videoHeight * width / v.videoWidth);
      c.width = width; c.height = h; ctx.drawImage(v, 0, 0, width, h);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.6));
      try {
        const r = await fetch('/frame/' + encodeURIComponent(cam),
          { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
        const j = await r.json(); sent++;
        s.innerHTML = `<b>${cam}</b>${j.known ? '' : ' <span class="bad">(not in the map)</span>'} · frames ${sent} · upload ${Math.round(performance.now() - t0)} ms<br>` +
          `people <b>${j.peopleCount}</b> · hazard ${j.hazard} · ${lastAudio} · pipeline ${j.latencyMs ?? '-'} ms ` +
          (j.ok ? '<span class="ok">OK</span>' : `<span class="bad">${j.error || 'warming up'}</span>`);
      } catch (e) {
        s.innerHTML = '<span class="bad">Upload failed: ' + e.message + '</span>';
      }
    }
    const wait = intervalMs - (performance.now() - t0);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
}
</script>
</body>
</html>
